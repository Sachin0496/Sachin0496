<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Sachin A S. CSE '28, KPR Institute of Engineering and Technology, Coimbatore. ML for semiconductor inspection, 35B models on 16 GB laptops, agents that ask before they refund.">
<style>

.hello { animation: fade .6s ease .05s both; }
.name { animation: rise .9s cubic-bezier(.2,.8,.2,1) .25s both; }
.bar { transform-box: fill-box; transform-origin: left center; animation: grow .7s cubic-bezier(.2,.8,.2,1) .9s both; }
.meta { animation: fade .8s ease .7s both; }
.tag { opacity: 0; animation: tag 12s ease-in-out infinite both; }
.tag.t0 { opacity: 1; }
.die { fill-opacity: .14; animation: die 3.2s linear infinite; }
.bad { fill-opacity: .5; animation: bad 3.2s linear infinite; }
.scan { animation: scan 3.2s linear infinite; }
.ret { animation: hunt 9s cubic-bezier(.65,0,.35,1) 1s infinite; }
.lock { transform-box: fill-box; transform-origin: center; animation: lock 3s ease-out 1s infinite both; }
.dot { animation: blink 1.2s steps(2, jump-none) infinite; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes tag { 0% { opacity: 0; transform: translateY(10px); } 4%, 21% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; transform: translateY(-10px); } }
@keyframes die { 0% { fill-opacity: .9; } 22%, 100% { fill-opacity: .14; } }
@keyframes bad { 0% { fill-opacity: 1; } 30%, 100% { fill-opacity: .5; } }
@keyframes scan { from { transform: translateY(0); } to { transform: translateY(208px); } }
@keyframes lock { 0% { opacity: 0; transform: scale(1.7); } 9% { opacity: 1; transform: scale(1); } 60% { opacity: 1; transform: scale(1); } 66.6%, 100% { opacity: 0; transform: scale(1); } }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: .15; } }

@keyframes hunt {
  0%, 22.2% { transform: translate(632.5px, 139.5px); }
  33.3%, 55.5% { transform: translate(670.5px, 158.5px); }
  66.6%, 88.8% { transform: translate(670.5px, 196.5px); }
  100% { transform: translate(632.5px, 139.5px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-hide { display: none; } }
</style>
