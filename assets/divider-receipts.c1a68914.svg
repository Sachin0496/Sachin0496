<svg xmlns="http://www.w3.org/2000/svg" width="860" height="34" viewBox="0 0 860 34" role="img" aria-label="receipts">
<style>
.p1 { animation: p1 2.8s cubic-bezier(.5,0,.75,0) infinite; }
.p2 { animation: p2 2.8s cubic-bezier(.5,0,.75,0) infinite; }
@keyframes p1 { from { transform: translateX(0); } to { transform: translateX(483.2px); } }
@keyframes p2 { from { transform: translateX(0); } to { transform: translateX(-483.2px); } }
.node { animation: node 2.8s ease-out infinite; }
@keyframes node { 0%, 88% { fill-opacity: .35; } 96% { fill-opacity: 1; } 100% { fill-opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-hide { display: none; } }
</style>
<defs>
<linearGradient id="pl"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="pr"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="0" y="15" width="373.2" height="4"/></clipPath>
<clipPath id="cr"><rect x="486.8" y="15" width="373.2" height="4"/></clipPath>
</defs>
<path d="M0 17H373.2M486.8 17H860" stroke="#8b949e" stroke-opacity=".35"/>
<g clip-path="url(#cl)"><rect class="p1 rm-hide" x="-110" y="16" width="110" height="2" fill="url(#pl)"/></g>
<g clip-path="url(#cr)"><rect class="p2 rm-hide" x="860" y="16" width="110" height="2" fill="url(#pr)"/></g>
<circle class="node" cx="373.2" cy="17" r="3" fill="#22d3ee"/>
<circle class="node" cx="486.8" cy="17" r="3" fill="#22d3ee"/>
<text x="430.0" y="21.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="3" fill="#8b949e">RECEIPTS</text>
</svg>
